[package]
name = "cctop"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Live terminal monitor for Claude Code token usage"

[dependencies]
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
notify = "8"
ratatui = "0.29"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
